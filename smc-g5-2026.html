<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Peserta & Penghargaan Competition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 26px;
        }
        .filter-section {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            background: #f8f9fa;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 180px;
        }
        .filter-group label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #495057;
        }
        .filter-group select, .filter-group input {
            padding: 8px 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }
        .filter-group select:focus, .filter-group input:focus {
            border-color: #4a90e2;
        }
        .stats {
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: bold;
            color: #2c3e50;
        }
        .table-responsive {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #dee2e6;
            max-height: 70vh;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
        }
        th, td {
            padding: 10px 12px;
            text-align: left;
            font-size: 13px;
            border-bottom: 1px solid #dee2e6;
        }
        th {
            background-color: #2c3e50;
            color: #ffffff;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        tr:hover {
            background-color: #e9fac8;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .badge-exemplary { background-color: #d4edda; color: #155724; }
        .badge-outstanding { background-color: #cce5ff; color: #004085; }
        .badge-commendable { background-color: #fff3cd; color: #856404; }
        .badge-honorable { background-color: #e2e3e5; color: #383d41; }
        .no-data {
            text-align: center;
            padding: 20px;
            color: #6c757d;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🏆 Data Peserta, Lokasi Sekolah & Penghargaan</h1>

    <div class="filter-section">
        <div class="filter-group">
            <label for="countryFilter">Negara (Country):</label>
            <select id="countryFilter">
                <option value="ALL">Semua Negara</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="provinceFilter">Provinsi:</label>
            <select id="provinceFilter">
                <option value="ALL">Semua Provinsi</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="cityFilter">Kota / Kabupaten:</label>
            <select id="cityFilter">
                <option value="ALL">Semua Kota/Kab.</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="awardFilter">Penghargaan (Award):</label>
            <select id="awardFilter">
                <option value="ALL">Semua Penghargaan</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="searchFilter">Cari Nama / Sekolah / Indeks:</label>
            <input type="text" id="searchFilter" placeholder="Ketik kata kunci...">
        </div>
    </div>

    <div class="stats" id="statsInfo">Menampilkan 0 dari 0 peserta</div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>No. Indeks</th>
                    <th>Nama Peserta</th>
                    <th>Sekolah</th>
                    <th>Kota/Kab</th>
                    <th>Provinsi</th>
                    <th>Penghargaan</th>
