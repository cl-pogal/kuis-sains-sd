    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 26px;
        }
        .filter-section {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            background: #f8f9fa;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 180px;
        }
        .filter-group label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #495057;
        }
        .filter-group select, .filter-group input {
            padding: 8px 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }
        .filter-group select:focus, .filter-group input:focus {
            border-color: #4a90e2;
        }
        .stats {
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: bold;
            color: #2c3e50;
        }
        .table-responsive {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #dee2e6;
            max-height: 70vh;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
        }
        th, td {
            padding: 10px 12px;
            text-align: left;
            font-size: 13px;
            border-bottom: 1px solid #dee2e6;
        }
        th {
            background-color: #2c3e50;
            color: #ffffff;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        tr:hover {
            background-color: #e9fac8;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .badge-exemplary { background-color: #d4edda; color: #155724; }
        .badge-outstanding { background-color: #cce5ff; color: #004085; }
        .badge-commendable { background-color: #fff3cd; color: #856404; }
        .badge-honorable { background-color: #e2e3e5; color: #383d41; }
        .no-data {
            text-align: center;
            padding: 20px;
            color: #6c757d;
            font-style: italic;
        }
    </style>
</head>

    const participants = rawData.data || [];

    function initFilters() {
        const countrySelect = document.getElementById('countryFilter');
        const provinceSelect = document.getElementById('provinceFilter');
        const citySelect = document.getElementById('cityFilter');
        const awardSelect = document.getElementById('awardFilter');

        const countries = [...new Set(participants.map(i => i.country))].sort();
        const provinces = [...new Set(participants.map(i => i.province))].sort();
        const cities = [...new Set(participants.map(i => i.city))].sort();
        const awards = [...new Set(participants.map(i => i.award))].sort();

        countries.forEach(val => countrySelect.add(new Option(val, val)));
        provinces.forEach(val => provinceSelect.add(new Option(val, val)));
        cities.forEach(val => citySelect.add(new Option(val, val)));
        awards.forEach(val => awardSelect.add(new Option(val, val)));
    }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        const statsInfo = document.getElementById('statsInfo');
        tbody.innerHTML = '';

        statsInfo.textContent = `Menampilkan ${data.length} dari ${participants.length} peserta`;

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="no-data">Tidak ada data yang cocok.</td></tr>';
            return;
        }

        data.forEach(item => {
            const tr = document.createElement('tr');

            let badgeClass = 'badge-honorable';
            if (item.award === 'EXEMPLARY') badgeClass = 'badge-exemplary';
            else if (item.award === 'OUTSTANDING') badgeClass = 'badge-outstanding';
            else if (item.award === 'COMMENDABLE') badgeClass = 'badge-commendable';

            tr.innerHTML = `
                <td>${item.index_no}</td>
                <td><strong>${item.participant_name}</strong></td>
                <td>${item.school_name}</td>
                <td>${item.city}</td>
                <td>${item.province}</td>
                <td><span class="badge ${badgeClass}">${item.award}</span></td>
                <td>${item.school_ranking}</td>
                <td>${item.country_ranking}</td>
                <td>${item.global_ranking || '-'}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function filterData() {
        const country = document.getElementById('countryFilter').value;
        const province = document.getElementById('provinceFilter').value;
        const city = document.getElementById('cityFilter').value;
        const award = document.getElementById('awardFilter').value;
        const search = document.getElementById('searchFilter').value.toLowerCase();

        const filtered = participants.filter(item => {
            const matchCountry = (country === 'ALL') || (item.country === country);
            const matchProvince = (province === 'ALL') || (item.province === province);
            const matchCity = (city === 'ALL') || (item.city === city);
            const matchAward = (award === 'ALL') || (item.award === award);
            const matchSearch = (item.participant_name.toLowerCase().includes(search)) ||
                                (item.school_name.toLowerCase().includes(search)) ||
                                (item.index_no.toLowerCase().includes(search));

            return matchCountry && matchProvince && matchCity && matchAward && matchSearch;
        });

        renderTable(filtered);
    }

    document.getElementById('countryFilter').addEventListener('change', filterData);
    document.getElementById('provinceFilter').addEventListener('change', filterData);
    document.getElementById('cityFilter').addEventListener('change', filterData);
    document.getElementById('awardFilter').addEventListener('change', filterData);
    document.getElementById('searchFilter').addEventListener('input', filterData);

    window.onload = () => {
        initFilters();
        renderTable(participants);
    };
</script>
